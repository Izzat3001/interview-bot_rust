[package]
name = "interview_bot_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
frankenstein = { version = "0.33.0", features = ["async-http-client"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # Обязательно добавь это, судя по ошибке в quiz.rs
